name: Validate repository foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install --requirement requirements-dev.txt

      - name: Test portable schema resolution and supported invariants
        run: python -B -m unittest discover --start-directory tests --verbose

      - name: Validate schemas, records, references, and invariants
        run: python scripts/validate_repository.py

      - name: Evaluate mapped fixtures with offline test provider
        run: python -B scripts/run_evaluations.py

      - name: Validate procedural, claim and action catalogs
        run: |
          python -B scripts/procedural_intelligence.py validate
          python -B scripts/claim_engine.py validate
          python -B scripts/legal_action_os.py validate

      - name: Evaluate claim analysis with offline matter and model fixtures
        run: python -B -m unittest discover -s tests -p test_claim_engine.py -v

      - name: Evaluate Legal Action OS readiness, deadlines, documents and workspace
        run: python -B -m unittest discover -s tests -p test_legal_action_os.py -v

      - name: Check conversational JavaScript
        run: node --check app/web/app.js

      - name: Benchmark offline corpus and research contracts
        run: python -B scripts/benchmark_research.py --scale 1000 --output "$RUNNER_TEMP/pro-one-research-benchmark.json"

      - name: Benchmark normalized authority parsing and scoped search
        run: python -B scripts/benchmark_national_corpus.py --scale 10000

      - name: Benchmark bounded procedural research
        run: python -B scripts/procedural_intelligence.py benchmark

      - name: Benchmark matter updates, replay and document ingestion
        run: python -B scripts/benchmark_matter_intelligence.py

      - name: Benchmark claim analysis, snapshot storage and staleness
        run: python -B scripts/claim_engine.py benchmark

      - name: Benchmark Legal Action OS and artifact storage
        run: python -B scripts/legal_action_os.py benchmark

      - name: Compile a proposed capability review bundle
        run: python -B scripts/build_capability.py --jurisdiction Virginia --legal-area torts --topic premises_liability --output "$RUNNER_TEMP/pro-one-capability-review"

      - name: Build production container
        run: docker build -t pro-one:mvp .

      - name: Smoke-test production container
        run: |
          docker run -d --rm -p 127.0.0.1:8000:8000 --name pro-one-smoke pro-one:mvp
          python - <<'PY'
          import json, time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2) as response:
                      assert json.load(response)['status'] == 'ok'
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          with urllib.request.urlopen('http://127.0.0.1:8000/workflows') as response:
              assert len(json.load(response)['workflows']) == 3
          with urllib.request.urlopen('http://127.0.0.1:8000/model/status') as response:
              assert json.load(response)['mode'] == 'production'
          try:
              urllib.request.urlopen('http://127.0.0.1:8000/ready')
              raise AssertionError('Production research must remain unavailable')
          except urllib.error.HTTPError as error:
              assert error.code == 503
              readiness = json.load(error)
              assert readiness['checks']['research_mode_available'] is False
              assert readiness['release_approved'] is False
          with urllib.request.urlopen('http://127.0.0.1:8000/capabilities') as response:
              assert len(json.load(response)['capabilities']) == 4
          with urllib.request.urlopen('http://127.0.0.1:8000/openapi.json') as response:
              paths = json.load(response)['paths']
              assert all(path in paths for path in ('/research/evidence', '/research/compare', '/research/procedure', '/matters'))
          request = urllib.request.Request('http://127.0.0.1:8000/research/evidence',
              data=json.dumps({'country':'US','state':'Virginia','legal_area':'torts','topics':['premises_liability']}).encode(),
              headers={'Content-Type':'application/json'})
          try:
              urllib.request.urlopen(request)
              raise AssertionError('Proposed research must not execute in production')
          except urllib.error.HTTPError as error:
              assert error.code == 403
          request = urllib.request.Request('http://127.0.0.1:8000/research/citation',
              data=json.dumps({'citation':'278 Va. 84','state':'Virginia'}).encode(),
              headers={'Content-Type':'application/json'})
          try:
              urllib.request.urlopen(request)
              raise AssertionError('Citation research must not execute in production')
          except urllib.error.HTTPError as error:
              assert error.code == 403
          comparison = {'matters': [
              {'country': 'US', 'state': state, 'legal_area': 'landlord_tenant', 'topics': ['landlord_repairs']}
              for state in ('Virginia', 'Florida')
          ]}
          request = urllib.request.Request('http://127.0.0.1:8000/research/compare',
              data=json.dumps(comparison).encode(), headers={'Content-Type': 'application/json'})
          try:
              urllib.request.urlopen(request)
              raise AssertionError('Proposed research comparisons must not execute in production')
          except urllib.error.HTTPError as error:
              assert error.code == 403
          request = urllib.request.Request('http://127.0.0.1:8000/research/procedure',
              data=json.dumps({'message':'I fell at a restaurant in Virginia and want them to pay.'}).encode(),
              headers={'Content-Type':'application/json'})
          try:
              urllib.request.urlopen(request)
              raise AssertionError('Procedural research must not execute in production')
          except urllib.error.HTTPError as error:
              assert error.code == 403
              assert json.load(error)['detail']['code'] == 'procedural_release_review_required'
          request = urllib.request.Request('http://127.0.0.1:8000/matters',
              data=json.dumps({'text':'Synthetic matter smoke test'}).encode(),
              headers={'Content-Type':'application/json'})
          try:
              urllib.request.urlopen(request)
              raise AssertionError('Matter persistence must remain disabled in production')
          except urllib.error.HTTPError as error:
              assert error.code == 403
              assert json.load(error)['detail']['code'] == 'matter_release_review_required'
          matter = '/matters/00000000-0000-0000-0000-000000000000'
          analysis = '/claim-analysis/' + '0' * 64
          for suffix, body in (
              ('/legal-theories?revision=0', None), ('/claim-analysis', {'revision': 0}),
              (analysis, None), (analysis + '/questions', None),
          ):
              request = urllib.request.Request('http://127.0.0.1:8000' + matter + suffix,
                  data=json.dumps(body).encode() if body else None, headers={'Content-Type': 'application/json'})
              try:
                  urllib.request.urlopen(request)
                  raise AssertionError('Claim analysis must remain disabled in production')
              except urllib.error.HTTPError as error:
                  assert error.code == 403
                  assert json.load(error)['detail']['code'] == 'matter_release_review_required'
          artifact = '0' * 64
          for suffix, body in (
              ('/actions', None), ('/readiness', {'revision': 0, 'action_id': 'va_richmond_complaint'}),
              ('/readiness/' + artifact, None), ('/deadlines', None), ('/deadlines/' + artifact, None),
              ('/deadlines/evaluate', {'revision': 0, 'rule_id': 'va_richmond_response'}),
              ('/action-documents', {'revision': 0, 'readiness_id': artifact}),
              ('/action-documents/' + artifact, None), ('/workspace', None), ('/workspace', {'revision': 0}),
              ('/workspace/' + artifact, None), ('/tasks', None), ('/tasks/' + artifact, None),
              ('/reviews/' + artifact, None),
              ('/reviews', {'revision': 0, 'package_id': artifact, 'displayed_digest': artifact, 'reviewed': True}),
          ):
              request = urllib.request.Request('http://127.0.0.1:8000' + matter + suffix,
                  data=json.dumps(body).encode() if body else None, headers={'Content-Type': 'application/json'})
              try:
                  urllib.request.urlopen(request)
                  raise AssertionError('Legal Action OS must remain disabled in production')
              except urllib.error.HTTPError as error:
                  assert error.code == 403
                  assert error.headers['Cache-Control'] == 'no-store'
                  assert json.load(error)['detail']['code'] == 'matter_release_review_required'
          print('Production health, catalogs, OpenAPI and research, claim and action release gates passed.')
          PY
          docker stop pro-one-smoke
