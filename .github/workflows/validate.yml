name: Validate repository foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install --requirement requirements-dev.txt

      - name: Test portable schema resolution and supported invariants
        run: python -B -m unittest discover --start-directory tests --verbose

      - name: Validate schemas, records, references, and invariants
        run: python scripts/validate_repository.py

      - name: Evaluate mapped fixtures with offline test provider
        run: python -B scripts/run_evaluations.py
